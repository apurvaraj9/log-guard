[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logguard-cli"
version = "0.2.0"
description = "A 100% local, offline CLI tool that scans log files and Excel (.xlsx) spreadsheets and masks sensitive data (emails, phone numbers, API keys, IPs, credit cards) before you share them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Apurva Raj" }
]
keywords = [
    "logs",
    "logging",
    "masking",
    "redaction",
    "privacy",
    "security",
    "pii",
    "sensitive-data",
    "cli",
    "pre-commit",
    "excel",
    "xlsx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/apurvaraj9/log-guard"
Repository = "https://github.com/apurvaraj9/log-guard"
Issues = "https://github.com/apurvaraj9/log-guard/issues"

[project.scripts]
log-guard = "log_guard:main"

[tool.setuptools]
py-modules = ["log_guard"]